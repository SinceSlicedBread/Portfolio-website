<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/static/img/binary-code.png">
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="/static/css/styles.css" rel="stylesheet">
  </head>
    <body>
    <div class="container sticky-top">
        <header class="d-flex justify-content-center py-3">
            <ul class="nav nav-pills">
                <li class="nav-item"><a href="{{ url_for('home') }}" class="nav-link">Welcome</a></li>
                <li class="nav-item"><a href="{{ url_for('portfolio') }}" class="nav-link">Portfolio</a></li>
                <li class="nav-item"><a href="{{ url_for('contact') }}" class="nav-link">Contact</a></li>

                {% if not current_user.is_authenticated: %}
                    <li class="nav-item"><a href="{{ url_for('login') }}" class="nav-link">Login</a></li>
                    <li class="nav-item"><a href="{{ url_for('register') }}" class="nav-link">Register</a></li>
                {% else: %}
                    <li class="nav-item"><a href="{{ url_for('logout') }}" class="nav-link">Logout</a></li>
                {% endif %}

            </ul>

        </header>
    </div>

    </body>
</html>
